
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Command line integration
command_line:
  # CPU temperature sensor
  - sensor:
      name: CPU Temperature
      unique_id: rpi_cpu_temperature
      command: "cat /sys/class/thermal/thermal_zone0/temp"
      device_class: temperature
      unit_of_measurement: "°C"
      value_template: "{{ value | multiply(0.001) | round(1) }}"
      scan_interval: 60

# Templates
template:
  # Honeywell Evohome living room battery sensor
  - binary_sensor:
    - name: Evohome living room battery
      unique_id: evohome_living_room_battery
      device_class: battery
      state: >
        {% set status = state_attr('climate.woonkamer', 'status') | default({}, true) %}
        {% set faults = status.activeFaults | default([], true) %}
        {{ faults | selectattr('fault_type', 'equalto', 'TempZoneActuatorLowBattery') | list | count > 0 }}

  # Honeywell Evohome living room connectivity sensor
  - binary_sensor:
    - name: Evohome living room connectivity
      unique_id: evohome_living_room_connectivity
      device_class: connectivity
      state: >
        {% set status = state_attr('climate.woonkamer', 'status') | default({}, true) %}
        {% set faults = status.activeFaults | default([], true) %}
        {{ faults | selectattr('fault_type', 'equalto', 'TempZoneActuatorCommunicationLost') | list | count == 0 }}

  # Honeywell Evohome bedroom battery sensor
  - binary_sensor:
